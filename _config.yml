title: Filipe Rodrigues Blog
tagline: Notes on security, smartcards and embedded devices.
description: >-
  My thoughts and research on security, smartcards and embedded devices.
lang: en
timezone: America/Chicago

url: ""
baseurl: ""

github:
  username: kidbomb
twitter:
  username: kidbomb

social:
  name: Filipe Paz Rodrigues
  links:
    - https://twitter.com/kidbomb
    - https://github.com/kidbomb
    - https://github.com/filipepazrodrigues

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

mermaid:
  src: 'https://cdn.jsdelivr.net/npm/mermaid@11.10.1/dist/mermaid.min.js'

exclude:
  - README.md
  - LICENSE
  - serve.sh

excerpt_separator: <!--more-->
