---
layout: default
---

<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    </p>
  </header>

  {{ content }}
</article>

<p class="back"><a href="{{ '/' | relative_url }}">&larr; All writing</a></p>
