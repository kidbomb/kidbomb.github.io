<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.social.name }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.social.name }}</span>
      <span>
        <a href="https://github.com/{{ site.github.username }}">GitHub</a>
        <a href="https://twitter.com/{{ site.twitter.username }}">Twitter</a>
      </span>
    </footer>

    <script>
      // Render fenced ```mermaid blocks (the {% raw %}{% mermaid %}{% endraw %} tag handles itself).
      (function () {
        var blocks = document.querySelectorAll('.language-mermaid');
        if (!blocks.length) return;
        blocks.forEach(function (b) {
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = b.textContent;
          b.replaceWith(div);
        });
        if (window.mermaid) return;
        var s = document.createElement('script');
        s.src = '{{ site.mermaid.src }}';
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
